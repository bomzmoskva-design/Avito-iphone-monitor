steps:
  - name: Скачать код
    uses: actions/checkout@v4

  # Создаем и активируем venv
  - name: Установить Python и создать venv
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"
  
  # Активируем venv и ставим pip
  - name: Настроить venv
    run: |
      python -m pip install --upgrade pip

  # Устанавливаем все библиотеки внутри этого окружения
  - name: Установить библиотеки
    run: |
      pip install requests beautifulsoup4 playwright

  # Ставим браузер именно тем же интерпретатором,
  # которым мы будем запускать наш бот. Это критично!
  - name: Установить браузер Playwright
    run: |
      python -m playwright install chromium

  # Запускаем бота с теми же переменными среды
  - name: Запустить монитор
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    run: |
      python bot.py
